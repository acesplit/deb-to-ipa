version: 2

updates:
  # --- GitHub Actions (workflow files) ---
  # This repo has no package manifests of any kind — it's a single
  # workflow-dispatch script, not an application — so github-actions is
  # the only ecosystem dependabot has anything to watch here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
